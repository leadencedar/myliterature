# 构建纯静态产物并发布到 GitHub Pages。
#
# 数据全部在用户浏览器的 IndexedDB 里，没有后端、没有服务器密钥；
# 这个工作流只负责：装依赖 → 跑测试 → 构建（资源前缀改成 /<仓库名>/）→ 上传部署。
name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，新推送取消旧的未完成部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test:run

      # GitHub Pages 项目页在 /<仓库名>/ 子路径下，构建时必须带上前缀
      - name: 构建
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: 配置 Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v5
